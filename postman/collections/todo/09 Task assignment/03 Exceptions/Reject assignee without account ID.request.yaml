$kind: http-request
order: 1000
method: PUT
url: '{{baseUrl}}/projects/{{assignmentProjectId}}/tasks/{{assignmentTaskId}}/assignee'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Assignment needs an account ID', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        const problem = pm.response.json();
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:400');
      });
