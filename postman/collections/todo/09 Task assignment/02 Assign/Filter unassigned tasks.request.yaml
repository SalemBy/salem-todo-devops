$kind: http-request
order: 4000
method: GET
url: '{{baseUrl}}/projects/{{assignmentProjectId}}/tasks?assigneeId=none'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('The unassigned task is listed', () => {
        pm.response.to.have.status(200);
        const page = pm.response.json();
        pm.expect(page.totalElements).to.eql(1);
        pm.expect(String(page.items[0].id)).to.eql(pm.collectionVariables.get('assignmentTaskId'));
        pm.expect(page.items[0].assigneeId).to.eql(null);
      });
