$kind: http-request
order: 1000
method: PUT
url: '{{baseUrl}}/projects/{{assignmentProjectId}}/tasks/{{assignmentTaskId}}/assignee'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"accountId":{{assignmentMemberId}}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Task is assigned to the member', () => {
        pm.response.to.have.status(200);
        const task = pm.response.json();
        pm.expect(String(task.id)).to.eql(pm.collectionVariables.get('assignmentTaskId'));
        pm.expect(String(task.assigneeId)).to.eql(pm.collectionVariables.get('assignmentMemberId'));
      });
