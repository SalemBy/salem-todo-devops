$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/projects/{{filterProjectId}}/labels'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Backend"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Label created',()=>{pm.response.to.have.status(201);pm.collectionVariables.set('filterLabelId',String(pm.response.json().id));});
