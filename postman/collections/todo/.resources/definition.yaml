$kind: collection
name: Salem Todo DevOps
description: |-
  Run 00 Authentication first, then the desired feature folders in the same runner invocation.
  Each feature creates its own records and captures IDs automatically.  
  Run a complete feature folder; numbered subfolders show the required execution order.  
  Exceptions folders intentionally send invalid requests and assert 400, 403, 404, 409 or 422.  
  Projects are private to their members; 08 Memberships covers roles and member management.  
  Expected errors are successful tests when their status and response match the rules.  
  Tasks require a project. Project keys and task ownership are immutable.  
  Archival retains records; archived project tasks are readable but cannot be written.  
  Use a disposable database: scenarios create records and archive only their own records.  
  For Validation, load postman/documents/required-fields-cases.json in Collection Runner.  
  11 Administration needs ADMIN_EMAILS=postman-admin@example.com on a local server.  
  See postman/README.md for desktop and CLI instructions.
variables:
  baseUrl: http://127.0.0.1:8080
  projectId: ""
  projectKey: ""
  projectCreatedAt: ""
  projectBeforeInvalidUpdate: ""
  taskProjectId: ""
  taskProjectKey: ""
  otherProjectId: ""
  otherProjectKey: ""
  taskId: ""
  taskCreatedAt: ""
  taskUpdateSnapshot: ""
  inactiveTaskSnapshot: ""
  activeTaskId: ""
  activeTaskSnapshot: ""
  labelKey: ""
  labelProjectId: ""
  otherLabelKey: ""
  otherLabelProjectId: ""
  labelId: ""
  otherLabelId: ""
  labelTaskId: ""
  csrfToken: ""
  projectCreatedByAccountId: ""
  membershipKey: ""
  membershipProjectId: ""
  membershipOwnerId: ""
  membershipMemberId: ""
  adminEmail: postman-admin@example.com
  adminPassword: postman-admin-local-only
  adminAccountId: ""
  adminTargetId: ""
  adminProjectId: ""
  adminProjectKey: ""
  managerProjectId: ""
  managerProjectKey: ""
  managerAccountId: ""
  managerOwnerId: ""
  managerThirdId: ""
auth:
  type: noauth
scripts:
  - type: http:beforeRequest
    code: |-
      if (!['GET', 'HEAD', 'OPTIONS'].includes(pm.request.method)) {
        const baseUrl = pm.variables.replaceIn('{{baseUrl}}').replace(/\/$/, '');
        const authVars = pm.environment.get('manualAuth') === 'true' ? pm.environment : pm.variables;
        pm.sendRequest(baseUrl + '/auth/csrf', (error, response) => {
          if (error || response.code !== 200) {
            pm.execution.skipRequest();
            throw new Error('Could not obtain a CSRF token. Check baseUrl and that the API is running.');
          }
          const csrf = response.json();
          authVars.set('csrfToken', csrf.token);
          authVars.set('csrfHeader', csrf.headerName);
          pm.request.headers.upsert({ key: csrf.headerName, value: csrf.token });
        });
      }
    language: text/javascript
