$kind: http-request
name: Application status
order: 1000
method: GET
url: '{{baseUrl}}/'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Application is running', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('running');
        pm.expect(pm.response.json().application).to.eql('Salem Todo DevOps');
      });
