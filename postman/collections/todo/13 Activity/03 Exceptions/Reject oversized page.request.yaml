$kind: http-request
order: 1000
method: GET
url: '{{baseUrl}}/projects/{{activityProjectId}}/activity?size=101'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Pages hold at most 100 events', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().type).to.eql('urn:projetotodo:problem:400');
      });
