$kind: http-request
order: 3000
method: PUT
url: '{{baseUrl}}/projects/{{activityProjectId}}/activity'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Activity cannot be changed', () => {
        pm.response.to.have.status(405);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().type).to.eql('urn:projetotodo:problem:405');
      });
