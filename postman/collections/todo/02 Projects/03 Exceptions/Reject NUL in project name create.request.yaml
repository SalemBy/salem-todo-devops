$kind: http-request
order: 50000
method: POST
url: '{{baseUrl}}/projects'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Visible\u0000text","description":"Original description","key":"NULTEST"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reject NUL in project name create', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        const problem = pm.response.json();
        pm.expect(problem.status).to.eql(400);
        pm.expect(problem.errors.some(e => e.field === 'name' && e.message === 'Text must not contain NUL characters')).to.eql(true);
      });
