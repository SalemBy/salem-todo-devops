$kind: http-request
order: 55000
method: GET
url: '{{baseUrl}}/projects/{{projectId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('NUL updates preserve the entire project', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.deep.eql(JSON.parse(pm.collectionVariables.get('projectBeforeInvalidUpdate')));
      });
