$kind: http-request
order: 3000
method: GET
url: '{{baseUrl}}/projects/{{projectId}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('projectId')) throw new Error('Run Create project first');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Repeated archive does not modify the row again', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().updatedAt).to.eql(pm.collectionVariables.get('archivedUpdatedAt'));
        pm.expect(pm.response.json().name).to.eql('Updated Postman project');
      });
