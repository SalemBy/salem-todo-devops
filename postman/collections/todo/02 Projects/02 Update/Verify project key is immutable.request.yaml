$kind: http-request
order: 2000
method: PUT
url: '{{baseUrl}}/projects/{{projectId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Updated Postman project","description":"Updated details","key":"CHANGED"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Extra key cannot change project identity', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().key).to.eql(pm.collectionVariables.get('projectKey'));
        pm.expect(Date.parse(pm.response.json().createdAt)).to.eql(Date.parse(pm.collectionVariables.get('projectCreatedAt')));
        pm.collectionVariables.set('projectBeforeInvalidUpdate', JSON.stringify(pm.response.json()));
      });
