$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/auth/password'
headers:
  X-CSRF-TOKEN: '{{csrfToken}}'
  Content-Type: application/json
body:
  type: json
  content: '{"currentPassword":"{{authPassword}}","newPassword":"{{newAuthPassword}}"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const authVars = pm.environment.get('manualAuth') === 'true' ? pm.environment : pm.variables;
      authVars.set('newAuthPassword', pm.variables.replaceIn('{{$randomUUID}}'));
  - type: afterResponse
    language: text/javascript
    code: |-
      const authVars = pm.environment.get('manualAuth') === 'true' ? pm.environment : pm.variables;
      pm.test('Change password', () => {
        pm.response.to.have.status(204);
        authVars.set('authPassword', pm.variables.get('newAuthPassword'));
        authVars.unset('csrfToken');
      });
