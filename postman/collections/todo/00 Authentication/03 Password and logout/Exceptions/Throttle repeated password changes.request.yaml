$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/auth/password'
headers:
  X-CSRF-TOKEN: '{{csrfToken}}'
  Content-Type: application/json
body:
  type: json
  content: '{"currentPassword":"A wrong current password","newPassword":"A replacement passphrase!"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // The limit is 5 attempts per login per 15 minutes; use them up with wrong current passwords (400 each).
      const baseUrl = pm.variables.replaceIn('{{baseUrl}}').replace(/\/$/, '');
      const token = pm.variables.replaceIn('{{csrfToken}}');
      const attempt = (remaining) => {
        if (remaining === 0) return;
        pm.sendRequest({
          url: baseUrl + '/auth/password',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': token },
          body: { mode: 'raw', raw: JSON.stringify({ currentPassword: 'A wrong current password', newPassword: 'A replacement passphrase!' }) }
        }, (failed, result) => {
          if (failed || result.code !== 400) throw new Error(`Expected 400 while using up attempts, got ${result && result.code}`);
          attempt(remaining - 1);
        });
      };
      attempt(5);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Throttle repeated password changes', () => {
        pm.response.to.have.status(429);
        pm.expect(pm.response.headers.get('Content-Type')).to.eql('application/problem+json');
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store');
        pm.expect(Number(pm.response.headers.get('Retry-After'))).to.be.within(1, 900);
        const problem = pm.response.json();
        pm.expect(problem.status).to.eql(429);
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:429');
        pm.expect(problem.detail).to.eql('Too many requests. Try again later.');
      });
