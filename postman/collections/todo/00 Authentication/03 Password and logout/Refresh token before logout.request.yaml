$kind: http-request
order: 5000
method: GET
url: '{{baseUrl}}/auth/csrf'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const authVars = pm.environment.get('manualAuth') === 'true' ? pm.environment : pm.variables;
      pm.test('Refresh token before logout', () => {
        pm.response.to.have.status(200);
        const csrf = pm.response.json();
        authVars.set('csrfToken', csrf.token);
        authVars.set('csrfHeader', csrf.headerName);
        pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store');
      });
