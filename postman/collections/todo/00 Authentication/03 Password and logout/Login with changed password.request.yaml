$kind: http-request
order: 4000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  X-CSRF-TOKEN: '{{csrfToken}}'
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{authEmail}}","password":"{{authPassword}}"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Login with changed password', () => {
        pm.response.to.have.status(200);
      });
