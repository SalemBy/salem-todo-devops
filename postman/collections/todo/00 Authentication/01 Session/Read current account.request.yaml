$kind: http-request
order: 5000
method: GET
url: '{{baseUrl}}/auth/me'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Read current account', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().email).to.eql(pm.variables.get('authEmail'));
      });
