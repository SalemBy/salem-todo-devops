$kind: http-request
order: 2500
method: POST
url: '{{baseUrl}}/auth/verify'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"token":"{{verificationToken}}","password":"{{authPassword}}"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Emails are sent in the background, so poll Mailpit (docker compose up) for the newest one to this address.
      const email = (pm.environment.get('manualAuth') === 'true' ? pm.environment : pm.variables).get('authEmail');
      const mailpit = pm.variables.replaceIn('{{mailpitUrl}}').replace(/\/$/, '');
      const search = mailpit + '/api/v1/search?query=' + encodeURIComponent('to:"' + email + '"');
      const readToken = (attempt) => pm.sendRequest(search, (error, found) => {
        const messages = !error && found.code === 200 ? found.json().messages : [];
        if (messages.length === 0) {
          if (attempt < 20) return setTimeout(() => readToken(attempt + 1), 250);
          pm.execution.skipRequest();
          throw new Error('No verification email for ' + email + ' in Mailpit. Start it with docker compose up -d.');
        }
        pm.sendRequest(mailpit + '/api/v1/message/' + messages[0].ID, (readError, message) => {
          const match = !readError && message.code === 200 && message.json().Text.match(/token=([A-Za-z0-9_-]+)/);
          if (!match) {
            pm.execution.skipRequest();
            throw new Error('The Mailpit message has no verification token.');
          }
          pm.variables.set('verificationToken', match[1]);
        });
      });
      readToken(0);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Verify account email', () => {
        pm.response.to.have.status(204);
      });
