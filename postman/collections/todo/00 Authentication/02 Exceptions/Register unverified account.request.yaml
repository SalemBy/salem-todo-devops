$kind: http-request
order: 1700
method: POST
url: '{{baseUrl}}/auth/register'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{pendingEmail}}","displayName":"Postman pending","password":"{{pendingPassword}}"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Run-local disposable credentials; never stored in collection files.
      pm.variables.set('pendingEmail', pm.variables.replaceIn('{{$randomUUID}}') + '@example.com');
      pm.variables.set('pendingPassword', pm.variables.replaceIn('{{$randomUUID}}'));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('A new account starts unverified', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().emailVerified).to.eql(false);
      });
