$kind: http-request
order: 5000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  X-CSRF-TOKEN: '{{csrfToken}}'
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{throttleEmail}}","password":"A wrong test password!"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // A fresh unknown email, so the per-email limit (5 per 15 minutes) never locks a real account.
      const email = `throttle-${Date.now()}@example.com`;
      pm.variables.set('throttleEmail', email);
      const baseUrl = pm.variables.replaceIn('{{baseUrl}}').replace(/\/$/, '');
      pm.sendRequest(baseUrl + '/auth/csrf', (error, response) => {
        if (error || response.code !== 200) throw new Error('Could not obtain a CSRF token.');
        const csrf = response.json();
        pm.request.headers.upsert({ key: csrf.headerName, value: csrf.token });
        const attempt = (remaining) => {
          if (remaining === 0) return;
          pm.sendRequest({
            url: baseUrl + '/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json', [csrf.headerName]: csrf.token },
            body: { mode: 'raw', raw: JSON.stringify({ email, password: 'A wrong test password!' }) }
          }, (failed, result) => {
            if (failed || result.code !== 401) throw new Error(`Expected 401 while using up attempts, got ${result && result.code}`);
            attempt(remaining - 1);
          });
        };
        attempt(5);
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Throttle repeated logins for one email', () => {
        pm.response.to.have.status(429);
        pm.expect(pm.response.headers.get('Content-Type')).to.eql('application/problem+json');
        pm.expect(Number(pm.response.headers.get('Retry-After'))).to.be.within(1, 900);
        const problem = pm.response.json();
        pm.expect(problem.status).to.eql(429);
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:429');
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.detail).to.eql('Too many requests. Try again later.');
      });
