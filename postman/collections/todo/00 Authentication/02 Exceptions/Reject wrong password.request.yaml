$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  X-CSRF-TOKEN: '{{csrfToken}}'
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{authEmail}}","password":"A wrong test password!"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reject wrong password', () => {
        pm.response.to.have.status(401);
        const problem = pm.response.json();
        pm.expect(problem.status).to.eql(401);
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:401');
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(pm.response.json().detail).to.eql('Invalid credentials');
      });
