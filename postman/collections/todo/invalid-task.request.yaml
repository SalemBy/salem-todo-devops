$kind: http-request
name: Reject invalid task with field errors
order: 8000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":" "}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Validation uses the problem details contract', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        const problem = pm.response.json();
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:400');
        pm.expect(problem.title).to.eql('Bad Request');
        pm.expect(problem.status).to.eql(400);
        pm.expect(problem.detail).to.eql('Request validation failed');
        pm.expect(problem.instance).to.eql('/tasks');
        pm.expect(problem.errors).to.deep.include({field: 'title', message: 'Title is required'});
      });
