$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/auth/register'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{memberEmail}}","displayName":"Postman member","password":"{{memberPassword}}"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Run-local disposable credentials; never stored in collection files.
      pm.variables.set('memberEmail', pm.variables.replaceIn('{{$randomUUID}}') + '@example.com');
      pm.variables.set('memberPassword', pm.variables.replaceIn('{{$randomUUID}}'));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Second account is registered', () => {
        pm.response.to.have.status(201);
        pm.collectionVariables.set('membershipMemberId', String(pm.response.json().id));
      });
