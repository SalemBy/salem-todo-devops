$kind: http-request
order: 4000
method: DELETE
url: '{{baseUrl}}/projects/{{membershipProjectId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Archiving needs the owner role', () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(403);
      });
