$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/projects/{{membershipProjectId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Member sees the project with its role', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().role).to.eql('MEMBER');
      });
