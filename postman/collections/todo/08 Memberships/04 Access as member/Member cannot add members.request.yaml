$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/projects/{{membershipProjectId}}/members'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{authEmail}}","role":"VIEWER"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Adding members needs the owner role', () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(403);
      });
