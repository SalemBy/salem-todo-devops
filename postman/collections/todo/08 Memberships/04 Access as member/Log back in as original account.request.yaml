$kind: http-request
order: 7000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{authEmail}}","password":"{{authPassword}}"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Original account is logged in again', () => {
        pm.response.to.have.status(200);
        pm.expect(String(pm.response.json().id)).to.eql(pm.collectionVariables.get('membershipOwnerId'));
      });
