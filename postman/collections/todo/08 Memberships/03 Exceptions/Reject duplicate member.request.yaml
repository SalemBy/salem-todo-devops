$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/projects/{{membershipProjectId}}/members'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{memberEmail}}","role":"OWNER"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Duplicate member returns 409', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(409);
      });
