$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/projects/{{membershipProjectId}}/members'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"nobody-{{membershipKey}}@example.com","role":"MEMBER"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Unknown account returns 422', () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(422);
      });
