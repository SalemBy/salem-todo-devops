$kind: http-request
order: 5000
method: PUT
url: '{{baseUrl}}/projects/{{membershipProjectId}}/members/{{membershipOwnerId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"role":"MEMBER"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Last owner cannot be demoted', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(409);
      });
