$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/projects/{{commentProjectId}}/tasks/{{commentTaskId}}/comments'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('The comment is listed', () => {
        pm.response.to.have.status(200);
        const page = pm.response.json();
        pm.expect(page.totalElements).to.eql(1);
        pm.expect(String(page.items[0].id)).to.eql(pm.collectionVariables.get('commentId'));
      });
