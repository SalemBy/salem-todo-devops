$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/projects'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Label checks 2","key":"{{otherLabelKey}}"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: pm.collectionVariables.set('otherLabelKey', 'L' + pm.variables.replaceIn('{{$randomUUID}}').replace(/-/g, '').slice(0, 8).toUpperCase());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Create project 2', () => {
        pm.response.to.have.status(201);
        pm.collectionVariables.set('otherLabelProjectId', String(pm.response.json().id));
      });
