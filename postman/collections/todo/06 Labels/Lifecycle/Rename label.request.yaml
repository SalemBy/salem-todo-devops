$kind: http-request
order: 2000
method: PUT
url: '{{baseUrl}}/projects/{{labelProjectId}}/labels/{{labelId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"API"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Rename label', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().name).to.eql('API');
      });
