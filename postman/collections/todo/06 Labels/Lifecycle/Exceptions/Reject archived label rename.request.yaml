$kind: http-request
order: 3000
method: PUT
url: '{{baseUrl}}/projects/{{labelProjectId}}/labels/{{labelId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Changed"}'
scripts:
