$kind: http-request
order: 4000
method: GET
url: '{{baseUrl}}/projects/{{labelProjectId}}/tasks/{{labelTaskId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Verify task after rejected changes', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().title).to.eql('Label workflow');
        pm.expect(pm.response.json().status).to.eql('PENDING');
        pm.expect(pm.response.json().labels.map(l => l.id)).to.eql([Number(pm.collectionVariables.get('labelId'))]);
      });
