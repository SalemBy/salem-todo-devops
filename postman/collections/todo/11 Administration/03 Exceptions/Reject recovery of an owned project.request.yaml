$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/admin/projects/{{adminProjectId}}/owners'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"accountId":{{adminTargetId}}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('A project with an active owner is not recovered', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().detail).to.eql('Project already has an active owner');
      });
