$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/admin/accounts/999999999/deactivate'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Unknown account is 404', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().detail).to.eql('Account not found');
      });
