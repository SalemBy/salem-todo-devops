$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{targetEmail}}","password":"{{targetPassword}}"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Logged in as the target', () => {
        pm.response.to.have.status(200);
        pm.expect(String(pm.response.json().id)).to.eql(pm.collectionVariables.get('adminTargetId'));
      });
