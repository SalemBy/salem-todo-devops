$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/admin/accounts/{{adminTargetId}}/deactivate'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Target is deactivated and its project reported ownerless', () => {
        pm.response.to.have.status(200);
        const result = pm.response.json();
        pm.expect(result.account.active).to.eql(false);
        pm.expect(String(result.account.id)).to.eql(pm.collectionVariables.get('adminTargetId'));
        pm.expect(result.unassignedTasks).to.eql(0);
        pm.expect(result.ownerlessProjectIds.map(String)).to.include(pm.collectionVariables.get('adminProjectId'));
      });
