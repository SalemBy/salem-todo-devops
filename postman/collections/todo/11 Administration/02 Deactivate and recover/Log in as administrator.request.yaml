$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{adminEmail}}","password":"{{adminPassword}}"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Logged in as the administrator', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get('adminEmail'));
        pm.collectionVariables.set('adminAccountId', String(pm.response.json().id));
      });
