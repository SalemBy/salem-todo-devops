$kind: http-request
name: Read archived project
order: 5500
method: GET
url: '{{baseUrl}}/projects/{{projectId}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('projectId')) throw new Error('Run Create project first');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Archived project remains readable with preserved details', () => {
        pm.response.to.have.status(200);
        const project = pm.response.json();
        pm.expect(project.active).to.eql(false);
        pm.expect(project.name).to.eql('Updated Postman project');
        pm.expect(project.key).to.eql(pm.collectionVariables.get('projectKey'));
        pm.collectionVariables.set('archivedUpdatedAt', project.updatedAt);
      });
