$kind: http-request
name: Read project
order: 1000
method: GET
url: '{{baseUrl}}/projects/{{projectId}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('projectId')) throw new Error('Run Create project first');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Created project is readable', () => {
        pm.response.to.have.status(200);
        pm.expect(String(pm.response.json().id)).to.eql(pm.collectionVariables.get('projectId'));
        pm.expect(pm.response.json().active).to.eql(true);
      });
