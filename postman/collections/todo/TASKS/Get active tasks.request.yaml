$kind: http-request
name: Get active tasks
url: "{{baseUrl}}/tasks"
method: GET
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Only active tasks are returned', () => {
        pm.response.to.have.status(200);
        const tasks = pm.response.json();
        pm.expect(tasks).to.be.an('array');
        tasks.forEach(task => pm.expect(task.active).to.eql(true));
      });
