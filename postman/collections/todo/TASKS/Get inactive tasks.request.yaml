$kind: http-request
name: Get inactive tasks
order: 2000
method: GET
url: '{{baseUrl}}/tasks?active=false'
queryParams:
  - key: active
    value: 'false'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Only inactive tasks are returned', () => {
        pm.response.to.have.status(200);
        const tasks = pm.response.json();
        pm.expect(tasks).to.be.an('array');
        tasks.forEach(task => pm.expect(task.active).to.eql(false));
      });
