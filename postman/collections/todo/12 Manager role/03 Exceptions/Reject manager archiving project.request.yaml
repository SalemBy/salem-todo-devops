$kind: http-request
order: 2000
method: DELETE
url: '{{baseUrl}}/projects/{{managerProjectId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Managers cannot archive the project', () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().detail).to.eql('Your project role does not allow this action');
      });
