$kind: http-request
order: 1000
method: PUT
url: '{{baseUrl}}/projects/{{managerProjectId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Renamed by manager"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Managers cannot edit the project', () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().detail).to.eql('Your project role does not allow this action');
      });
