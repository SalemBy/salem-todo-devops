$kind: http-request
order: 4000
method: PUT
url: '{{baseUrl}}/projects/{{managerProjectId}}/members/{{managerThirdId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"role":"VIEWER"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Managers change members and viewers', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().role).to.eql('VIEWER');
      });
