$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks/{{activeTaskId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Persisted resource is readable before the next operation', () => {
        pm.response.to.have.status(200);
        pm.collectionVariables.set('activeTaskSnapshot', JSON.stringify(pm.response.json()));
      });
