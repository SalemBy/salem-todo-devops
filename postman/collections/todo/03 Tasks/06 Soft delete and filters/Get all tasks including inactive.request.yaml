$kind: http-request
order: 4000
method: GET
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks?active=all'
queryParams:
  - key: active
    value: all
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Project all filter includes the inactive task', () => {
        pm.response.to.have.status(200);
        const tasks = pm.response.json();
        pm.expect(tasks).to.be.an('array');
        const task = tasks.find(t => String(t.id) === pm.collectionVariables.get('taskId'));
        pm.expect(task).to.be.an('object');
        pm.expect(task.active).to.eql(false);
        pm.expect(String(task.projectId)).to.eql(pm.collectionVariables.get('taskProjectId'));
      });
