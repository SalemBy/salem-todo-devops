$kind: http-request
order: 5000
method: GET
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks?active=true'
queryParams:
  - key: active
    value: 'true'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Project filter honors active=true', () => {
        pm.response.to.have.status(200);
        const tasks = pm.response.json().items;
        pm.expect(tasks.length).to.eql(0);
        tasks.forEach(t => pm.expect(String(t.projectId)).to.eql(pm.collectionVariables.get('taskProjectId')));
      });
