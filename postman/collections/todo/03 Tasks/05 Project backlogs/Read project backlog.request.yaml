$kind: http-request
order: 1000
method: GET
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Backlog includes only this project', () => {
        pm.response.to.have.status(200);
        const tasks = pm.response.json();
        pm.expect(tasks.some(t => String(t.id) === pm.collectionVariables.get('taskId'))).to.eql(true);
        tasks.forEach(t => pm.expect(String(t.projectId)).to.eql(pm.collectionVariables.get('taskProjectId')));
      });
