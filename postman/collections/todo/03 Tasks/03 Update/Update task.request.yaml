$kind: http-request
order: 1000
method: PUT
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks/{{taskId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"title":"Updated task","description":"Updated with Postman","status":"IN_PROGRESS"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Task is updated', () => {
        pm.response.to.have.status(200);
        const task = pm.response.json();
        pm.expect(String(task.id)).to.eql(String(pm.variables.get('taskId')));
        pm.expect(task.title).to.eql('Updated task');
        pm.expect(task.description).to.eql('Updated with Postman');
        pm.expect(task.status).to.eql('IN_PROGRESS');
        pm.expect(String(task.projectId)).to.eql(pm.collectionVariables.get('taskProjectId'));
        pm.expect(task.createdAt).to.eql(pm.collectionVariables.get('taskCreatedAt'));
        pm.expect(task.active).to.eql(true);
      });
