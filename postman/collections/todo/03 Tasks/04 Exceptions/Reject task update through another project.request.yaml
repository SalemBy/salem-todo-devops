$kind: http-request
order: 11000
method: PUT
url: '{{baseUrl}}/projects/{{otherProjectId}}/tasks/{{taskId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Wrong project","status":"COMPLETED"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Other project cannot update task', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(404);
      });
