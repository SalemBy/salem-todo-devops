$kind: http-request
order: 6000
method: POST
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":""}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected 400 ProblemDetail', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        const problem = pm.response.json();
        pm.expect(problem.status).to.eql(400);
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:400');
        pm.expect(problem.errors.some(e => e.field === 'title')).to.eql(true);
      });
