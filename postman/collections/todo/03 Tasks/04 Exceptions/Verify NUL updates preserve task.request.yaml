$kind: http-request
order: 55000
method: GET
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks/{{taskId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('NUL updates preserve the entire task', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.deep.eql(JSON.parse(pm.collectionVariables.get('taskUpdateSnapshot')));
      });
