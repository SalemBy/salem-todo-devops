$kind: http-request
order: 52000
method: POST
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Visible text","description":"Visible\u0000text"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reject NUL in task description create', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        const problem = pm.response.json();
        pm.expect(problem.status).to.eql(400);
        pm.expect(problem.errors.some(e => e.field === 'description' && e.message === 'Text must not contain NUL characters')).to.eql(true);
      });
