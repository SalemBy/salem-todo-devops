$kind: http-request
order: 13000
method: POST
url: '{{baseUrl}}/projects/{{taskProjectId}}.75/tasks'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Fractional owner"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('beforeFractionalOwner')) throw new Error('Read the integer owner backlog first');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Fractional project ID is rejected', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(400);
        pm.expect(pm.response.json().type).to.eql('urn:projetotodo:problem:400');
      });
