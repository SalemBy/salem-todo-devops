$kind: http-request
order: 1000
method: PUT
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks/{{taskId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Must not change","status":"COMPLETED"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected 404 ProblemDetail', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        const problem = pm.response.json();
        pm.expect(problem.status).to.eql(404);
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:404');
        pm.expect(problem.detail).to.eql('Task not found');
      });
