$kind: http-request
order: 4000
method: DELETE
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks/{{activeTaskId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Request is rejected with 409', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        pm.expect(pm.response.json().status).to.eql(409);
      });
