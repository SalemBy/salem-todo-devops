$kind: http-request
url: "{{baseUrl}}/projects/{{taskProjectId}}/tasks"
method: GET
order: 3000
scripts:
  - type: afterResponse
    code: |-
      pm.test('Only active tasks are returned', () => {
        pm.response.to.have.status(200);
        const tasks = pm.response.json().items;
        pm.expect(tasks).to.be.an('array');
        tasks.forEach(task => pm.expect(task.active).to.eql(true));
      });
    language: text/javascript
