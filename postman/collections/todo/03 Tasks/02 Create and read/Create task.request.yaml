$kind: http-request
order: 1000
method: POST
url: "{{baseUrl}}/projects/{{taskProjectId}}/tasks"
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"My first task","description":"Created with Postman"}'
examples: .resources/Create task.resources/examples
scripts:
  - type: afterResponse
    code: |-
      pm.test('Task is created', () => {
        pm.response.to.have.status(201);
        const task = pm.response.json();
        pm.expect(task.id).to.be.a('number');
        pm.collectionVariables.set('taskId', String(task.id));
        pm.collectionVariables.set('taskCreatedAt', task.createdAt);
        pm.expect(String(task.projectId)).to.eql(pm.collectionVariables.get('taskProjectId'));
        pm.expect(task.active).to.eql(true);
        pm.expect(task.title).to.eql('My first task');
        pm.expect(task.status).to.eql('PENDING');
        pm.response.to.have.header('Location');
        pm.expect(pm.response.headers.get('Location')).to.match(new RegExp('/projects/' + task.projectId + '/tasks/' + task.id + '$'));
      });
    language: text/javascript
