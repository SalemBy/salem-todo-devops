$kind: http-request
order: 1000
method: GET
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks?active=all'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Read archived project backlog', () => {
        pm.response.to.have.status(200);
        const tasks = pm.response.json().items;
        pm.expect(tasks.length).to.eql(2);
        tasks.forEach(t => pm.expect(String(t.projectId)).to.eql(pm.collectionVariables.get('taskProjectId')));
        pm.expect(tasks.find(t => String(t.id) === pm.collectionVariables.get('activeTaskId'))).to.deep.eql(JSON.parse(pm.collectionVariables.get('activeTaskSnapshot')));
        pm.expect(tasks.find(t => String(t.id) === pm.collectionVariables.get('taskId'))).to.deep.eql(JSON.parse(pm.collectionVariables.get('inactiveTaskSnapshot')));
      });
