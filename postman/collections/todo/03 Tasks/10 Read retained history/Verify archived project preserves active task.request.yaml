$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/projects/{{taskProjectId}}/tasks/{{activeTaskId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Project archive and rejected writes preserve the active task', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.deep.eql(JSON.parse(pm.collectionVariables.get('activeTaskSnapshot')));
      });
