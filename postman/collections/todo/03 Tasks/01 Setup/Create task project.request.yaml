$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/projects'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Task checks","key":"{{taskProjectKey}}"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: pm.collectionVariables.set('taskProjectKey', 'T' + pm.variables.replaceIn('{{$randomUUID}}').replace(/-/g, '').slice(0, 8).toUpperCase());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Task project is created', () => {
        pm.response.to.have.status(201);
        pm.collectionVariables.set('taskProjectId', String(pm.response.json().id));
      });
