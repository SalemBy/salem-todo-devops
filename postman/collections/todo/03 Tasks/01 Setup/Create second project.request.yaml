$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/projects'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Other task project","key":"{{otherProjectKey}}"}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('otherProjectKey', 'O' + pm.variables.replaceIn('{{$randomUUID}}').replace(/-/g, '').slice(0, 8).toUpperCase());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Second project is created', () => {
        pm.response.to.have.status(201);
        pm.collectionVariables.set('otherProjectId', String(pm.response.json().id));
      });
