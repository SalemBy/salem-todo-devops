$kind: http-request
name: Reject blank task title
order: 1000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{{validationBody}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const data = pm.iterationData.toObject();
      const body = {};
      if (!data.omit) body.title = Object.prototype.hasOwnProperty.call(data, 'value') ? data.value : ' ';
      pm.variables.set('validationBody', JSON.stringify(body));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('title is rejected independently (' + (pm.iterationData.get('label') || 'space') + ')', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
        const problem = pm.response.json();
        pm.expect(problem.errors.some(error => error.field === 'title')).to.eql(true);
      });
