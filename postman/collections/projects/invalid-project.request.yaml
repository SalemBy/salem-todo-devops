$kind: http-request
name: Reject invalid project fields
order: 6000
method: POST
url: '{{baseUrl}}/projects'
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"name":" ","key":"LEGACY"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Project validation identifies invalid fields', () => {
        pm.response.to.have.status(400);
        const problem = pm.response.json();
        pm.expect(problem.type).to.eql('urn:projetotodo:problem:400');
        pm.expect(problem.errors.some(error => error.field === 'name')).to.eql(true);
        pm.expect(problem.errors.some(error => error.field === 'key' && error.message.includes('reserved'))).to.eql(true);
      });
