$kind: http-request
name: Verify archived project is excluded from active list
order: 15000
method: GET
url: '{{baseUrl}}/projects'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Default list excludes the archived project', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().some(project => String(project.id) === pm.collectionVariables.get('projectId'))).to.eql(false);
      });
