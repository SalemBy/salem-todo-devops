spring.application.name=salem-todo-devops PostgreSQL Tests
spring.config.import=
server.address=127.0.0.1
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.auth.registration-enabled=true
server.servlet.session.cookie.secure=false

spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# A fresh key prefix per Spring context keeps counters apart; high limits keep unrelated tests unthrottled.
app.rate-limit.key-prefix=test:${random.uuid}:
app.rate-limit.login-per-address.max=100000
app.rate-limit.login-per-email.max=100000
app.rate-limit.register-per-address.max=100000
app.rate-limit.sessions-per-address.max=100000
app.rate-limit.password-change-per-login.max=100000
