spring.application.name=salem-todo-devops
spring.config.import=optional:file:./.env[.properties]
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/todo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
# System administrators by email, comma-separated (#67). Empty: none.
app.admin.emails=${ADMIN_EMAILS:}
app.auth.absolute-timeout=12h
# Email verification (#71): the link in the email points to this page, which posts the token to /auth/verify.
app.auth.verification-url=${AUTH_VERIFICATION_URL:http://127.0.0.1:3000/verify-email}
app.auth.verification-token-ttl=24h
app.mail.from=${MAIL_FROM:no-reply@salem-todo.local}
# SMTP: Docker Compose's Mailpit by default; its inbox is at http://127.0.0.1:8025.
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# A mail outage only delays verification emails; it must not mark the API down.
management.health.mail.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Sessions live in Redis (Spring Session); keep the cookie name, whose Spring Session default is SESSION.
server.servlet.session.cookie.name=JSESSIONID

# Redis holds the authentication rate-limit counters. Short timeouts make an unreachable Redis fail fast (503).
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
# Actuator: a separate management server on the loopback address; the public port exposes none of it (#51).
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.metrics.tags.application=${spring.application.name}

app.rate-limit.key-prefix=rl:
app.rate-limit.login-per-address.max=20
app.rate-limit.login-per-address.window=1m
app.rate-limit.login-per-email.max=5
app.rate-limit.login-per-email.window=15m
app.rate-limit.register-per-address.max=5
app.rate-limit.register-per-address.window=1h
app.rate-limit.sessions-per-address.max=30
app.rate-limit.sessions-per-address.window=1m
app.rate-limit.password-change-per-login.max=5
app.rate-limit.password-change-per-login.window=15m
app.rate-limit.password-change-per-address.max=10
app.rate-limit.password-change-per-address.window=1m
app.rate-limit.verification-email-per-address.max=5
app.rate-limit.verification-email-per-address.window=1h
app.rate-limit.verification-email-per-email.max=3
app.rate-limit.verification-email-per-email.window=1h
