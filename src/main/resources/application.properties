spring.application.name=salem-todo-devops
spring.config.import=optional:file:./.env[.properties]
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/todo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
app.auth.absolute-timeout=12h
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Sessions live in Redis (Spring Session); keep the cookie name, whose Spring Session default is SESSION.
server.servlet.session.cookie.name=JSESSIONID

# Redis holds the authentication rate-limit counters. Short timeouts make an unreachable Redis fail fast (503).
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
app.rate-limit.key-prefix=rl:
app.rate-limit.login-per-address.max=20
app.rate-limit.login-per-address.window=1m
app.rate-limit.login-per-email.max=5
app.rate-limit.login-per-email.window=15m
app.rate-limit.register-per-address.max=5
app.rate-limit.register-per-address.window=1h
app.rate-limit.sessions-per-address.max=30
app.rate-limit.sessions-per-address.window=1m
app.rate-limit.password-change-per-login.max=5
app.rate-limit.password-change-per-login.window=15m
app.rate-limit.password-change-per-address.max=10
app.rate-limit.password-change-per-address.window=1m
